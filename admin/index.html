<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Cook What? admin</title>
  <!-- Private page: never indexed, never followed, never in sitemap.xml, no
       analytics snippet, no referrer sent when a receipt opens. -->
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <meta name="googlebot" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1C1B19" media="(prefers-color-scheme: dark)" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; img-src 'self' data: blob: https://vxshopubxgqmyyplxmwv.supabase.co; connect-src https://vxshopubxgqmyyplxmwv.supabase.co; base-uri 'none'; form-action 'none'" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <!--
    getcookwhat.com/admin/ — Tano's inbox for FairPrice voucher purchases and
    helper voucher redemptions. The web twin of the phone app's admin screen
    (app/admin/topups.tsx, lib/topupsApi.ts): same RPCs, same rules, same
    wording. How to use it: Docs/admin_web.md.

    SECURITY. This page holds only the PUBLIC project URL and anon key (the
    EXPO_PUBLIC_ values the app already ships). It is not the gate. Every
    read and write below is refused by the database for anyone not in
    app_admins: admin_list_topups, confirm_topup, reject_topup,
    admin_list_redemptions and admin_mark_redemption_sent each re-check
    is_app_admin(); household_voucher_delivery and the topup-receipts bucket
    are behind is_app_admin() RLS policies. Checking is_app_admin() here only
    decides what to render.

    Everything from the database is written with textContent, never as HTML.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"
          integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9"
          crossorigin="anonymous"></script>
  <style>
    :root {
      --coral: #F0532C;
      --coral-text: #C43D1B;
      --teal: #0A7D6F;
      --danger: #C62828;
      --ink: #2C2C2A;
      --muted: #6B6358;
      --line: #E0DCD0;
      --page: #FBF7F1;
      --card: #FFFFFF;
      --field: #FFFFFF;
      --chip: #F1F0EC;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.12);
      --on-coral: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --coral: #F26A47;
        --coral-text: #FF8A66;
        --teal: #3CC9B4;
        --danger: #FF6B66;
        --ink: #F2EFE9;
        --muted: #B5AC9F;
        --line: #3A3733;
        --page: #141311;
        --card: #1F1E1B;
        --field: #262421;
        --chip: #2A2825;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        --on-coral: #FFFFFF;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--page);
      color: var(--ink);
      line-height: 1.45;
      font-size: 16px;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
    .hidden { display: none !important; }

    /* Header */
    header.top {
      position: sticky; top: 0; z-index: 5;
      background: var(--page);
      border-bottom: 1px solid var(--line);
      padding: calc(10px + env(safe-area-inset-top)) 0 10px;
    }
    header.top .wrap { display: flex; align-items: center; gap: 10px; padding-bottom: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; flex: 1; min-width: 0; }
    .brand { white-space: nowrap; }
    .brand img { width: 28px; height: 28px; border-radius: 7px; }
    @media (max-width: 420px) {
      .brand .tag { display: none; }
      .icon-btn { padding: 7px 10px; }
    }
    .brand .tag { font-weight: 600; font-size: 12px; color: var(--coral-text); border: 1.5px solid var(--coral); border-radius: 20px; padding: 1px 8px; }
    .icon-btn {
      font: inherit; font-size: 14px; font-weight: 600;
      background: transparent; color: var(--ink);
      border: 1.5px solid var(--line); border-radius: 10px;
      padding: 7px 12px; cursor: pointer; min-height: 38px;
    }
    .icon-btn:disabled { opacity: 0.5; cursor: default; }
    .updated { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

    h1 { font-size: 26px; margin: 18px 0 4px; }
    .lead { color: var(--muted); margin: 0 0 14px; font-size: 15px; }

    /* Tabs */
    .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 12px; }
    @media (max-width: 520px) { .tabs { grid-template-columns: repeat(2, 1fr); } }
    .tab {
      font: inherit; font-size: 14px; font-weight: 600;
      padding: 9px 6px; border-radius: 20px; cursor: pointer;
      background: var(--card); color: var(--ink);
      border: 1.5px solid var(--line);
    }
    .tab[aria-selected="true"] { border-color: var(--coral); color: var(--coral-text); background: var(--card); box-shadow: inset 0 -3px 0 var(--coral); }
    .tab .count { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 6px; border-radius: 10px; background: var(--coral); color: var(--on-coral); font-size: 12px; line-height: 18px; }
    .tab .count.zero { background: var(--chip); color: var(--muted); }
    .group-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }

    /* Cards */
    .card {
      background: var(--card);
      border-left: 3px solid var(--coral);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 14px 16px 16px;
      margin: 0 0 14px;
    }
    .card.subdued { border-left-color: var(--line); }
    .card h2 { font-size: 18px; margin: 0; line-height: 1.3; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .reference { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; letter-spacing: 1px; margin-top: 6px; }
    .status { font-weight: 600; margin-top: 8px; }
    .status.teal { color: var(--teal); }
    .status.coral { color: var(--coral-text); }
    .status.danger { color: var(--danger); }
    .muted { color: var(--muted); font-size: 15px; margin-top: 2px; overflow-wrap: anywhere; }
    .muted.italic { font-style: italic; }
    .danger-text { color: var(--danger); }
    .body { margin-top: 6px; }
    .link { font: inherit; font-weight: 700; color: var(--coral-text); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: none; }
    .receipt { display: block; margin-top: 12px; }
    .receipt img { display: block; width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; background: var(--chip); }

    /* Buttons */
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .actions > * { flex: 1; }
    .btn {
      font: inherit; font-weight: 700; font-size: 16px;
      min-height: 46px; padding: 10px 14px; border-radius: 12px; cursor: pointer;
      border: 1.5px solid transparent; width: 100%;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.success { background: #16A34A; color: #FFFFFF; }
    .btn.primary { background: var(--coral); color: var(--on-coral); }
    .btn.danger { background: var(--danger); color: #FFFFFF; }
    .btn.danger-outline { background: transparent; color: var(--danger); border-color: var(--danger); }
    .btn.muted { background: transparent; color: var(--ink); border-color: var(--line); }

    label.field { display: block; font-weight: 600; font-size: 15px; margin: 14px 0 6px; }
    textarea, input[type="email"], input[type="password"] {
      font: inherit; width: 100%; color: var(--ink); background: var(--field);
      border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
    }
    textarea { min-height: 84px; resize: vertical; }
    textarea:focus, input:focus { outline: 2px solid var(--coral); outline-offset: 1px; border-color: transparent; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 4px; text-align: right; }

    .empty { text-align: center; padding: 28px 12px; color: var(--muted); }
    .empty .icon { font-size: 28px; }
    .notice { border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; background: var(--chip); font-size: 15px; }
    .notice.error { color: var(--danger); }

    /* Sign-in */
    .signin { max-width: 400px; margin: 40px auto 0; }
    .signin .card { padding: 20px; }
    .signin .btn { margin-top: 18px; }

    /* Dialog */
    dialog {
      border: 0; border-radius: 16px; padding: 20px; width: min(440px, calc(100vw - 32px));
      background: var(--card); color: var(--ink); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    dialog h3 { margin: 0 0 8px; font-size: 19px; line-height: 1.3; }
    dialog p { margin: 0 0 8px; color: var(--muted); }
    dialog .actions { flex-direction: column-reverse; }
    @media (min-width: 521px) { dialog .actions { flex-direction: row; } }
    .skeleton { height: 120px; border-radius: 16px; background: var(--chip); margin: 0 0 14px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.55; } }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand"><img src="/assets/logo-bowl.png" alt="" /> Cook What? <span class="tag">Admin</span></div>
      <button type="button" class="icon-btn hidden" id="refresh">Refresh</button>
      <button type="button" class="icon-btn hidden" id="signout">Sign out</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Sign-in -->
    <section id="signin-view" class="signin hidden" aria-labelledby="signin-title">
      <div class="card">
        <h2 id="signin-title">Sign in</h2>
        <p class="muted">Admins only. Use the Cook What? account that is on the admin list.</p>
        <form id="signin-form" novalidate>
          <label class="field" for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required />
          <label class="field" for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
          <p id="signin-error" class="notice error hidden" role="alert"></p>
          <button type="submit" class="btn primary" id="signin-button">Sign in</button>
        </form>
      </div>
    </section>

    <!-- Inbox -->
    <section id="inbox-view" class="hidden">
      <h1>Voucher purchases</h1>
      <p class="updated" id="updated" aria-live="polite"></p>
      <div class="tabs" role="tablist" id="tabs"></div>
      <p class="lead" id="lead"></p>
      <div id="list"></div>
    </section>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <h3 id="dialog-title"></h3>
    <div id="dialog-body"></div>
    <div class="actions" id="dialog-actions"></div>
  </dialog>

  <script>
  (function () {
    'use strict';

    // Never run inside someone else's frame (a meta CSP cannot set
    // frame-ancestors, and GitHub Pages cannot send the header).
    if (window.top !== window.self) {
      document.body.textContent = '';
      return;
    }

    var SUPABASE_URL = 'https://vxshopubxgqmyyplxmwv.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ4c2hvcHVieGdxbXl5cGx4bXd2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMyODUyNDYsImV4cCI6MjA5ODg2MTI0Nn0.IOcdWXpgFB7vID5_dtUs09DoFmfHeiI2JKmBHNpzlYo';
    var AUTO_REFRESH_MS = 60000;
    var RECEIPT_URL_SECONDS = 600; // as receiptUrl in lib/topupsApi.ts
    var REASON_MAX = 300;
    var NOTE_MAX = 300;

    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: false, // nothing ever arrives in this page's URL
        storageKey: 'cookwhat-admin-auth'
      }
    });

    // ---- State ---------------------------------------------------------
    var state = {
      tab: 'open',            // open | decided | redemptions | sent
      openRows: [],
      decidedRows: [],
      redemptions: [],
      deliveries: {},         // household_id -> { name, phone, address }
      rejecting: {},          // topup id -> draft reason (form open)
      busy: null,             // id of the row an action is running on
      loaded: false,
      failed: null,           // what failed to load, or null
      redemptionsMissingFulfil: false, // admin_list_redemptions predates sql/topup/05
      updatedAt: null
    };
    var receiptCache = {};    // path -> { url, until }
    var timer = null;
    var signedIn = false;

    // ---- Small DOM helpers (textContent only) --------------------------
    function el(tag, attrs) {
      var node = document.createElement(tag);
      if (attrs) {
        Object.keys(attrs).forEach(function (k) {
          var v = attrs[k];
          if (v === null || v === undefined || v === false) return;
          if (k === 'text') node.textContent = v;
          else if (k === 'class') node.className = v;
          else if (k.indexOf('on') === 0) node.addEventListener(k.slice(2), v);
          else node.setAttribute(k, v === true ? '' : v);
        });
      }
      for (var i = 2; i < arguments.length; i++) {
        var c = arguments[i];
        if (c === null || c === undefined || c === false) continue;
        node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      }
      return node;
    }
    function $(id) { return document.getElementById(id); }
    function show(node, on) { node.classList.toggle('hidden', !on); }

    // ---- Formatting (mirrors lib/topups.ts formatSgd / timeAgo) --------
    function formatSgd(amount) {
      var n = Number(amount);
      return Number.isInteger(n) ? 'S$' + n : 'S$' + n.toFixed(2);
    }
    function timeAgo(iso) {
      if (!iso) return '';
      var diff = Date.now() - new Date(iso).getTime();
      if (!isFinite(diff)) return '';
      var minutes = Math.floor(diff / 60000);
      if (minutes < 1) return 'just now';
      if (minutes < 60) return minutes + ' min ago';
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + ' h ago';
      var days = Math.floor(hours / 24);
      return days === 1 ? '1 day ago' : days + ' days ago';
    }
    function formatDay(iso) {
      if (!iso) return '';
      return new Date(iso).toLocaleDateString('en-SG', { day: 'numeric', month: 'short' });
    }
    function formatTime(d) {
      return d.toLocaleTimeString('en-SG', { hour: 'numeric', minute: '2-digit' });
    }
    function errorText(err) {
      if (!err) return 'Try again.';
      return err.message || String(err);
    }
    function isMissingFunction(err) {
      return !!err && (err.code === 'PGRST202' || /could not find the function/i.test(err.message || ''));
    }

    // Delivery line, as deliverySummary in lib/voucherDelivery.ts.
    function deliveryFrom(row) {
      if (!row || !row.recipient_name || !row.recipient_phone || !row.delivery_address) return null;
      return { name: row.recipient_name, phone: row.recipient_phone, address: row.delivery_address };
    }
    function deliveryLine(d) {
      if (!d) return el('div', { class: 'muted italic', text: 'Deliver to: No delivery details given' });
      return el('div', { class: 'muted' }, 'Deliver to: ',
        el('span', { class: 'pii', text: d.name + ' · ' + d.phone + ' · ' + d.address.replace(/\s*\n\s*/g, ', ') }));
    }

    // ---- Dialog --------------------------------------------------------
    // ask({ title, body: [nodes], actions: [{ label, kind, value }] }) -> value
    function ask(opts) {
      return new Promise(function (resolve) {
        var dialog = $('dialog');
        $('dialog-title').textContent = opts.title;
        var body = $('dialog-body');
        body.textContent = '';
        (opts.body || []).forEach(function (n) { body.appendChild(typeof n === 'string' ? el('p', { text: n }) : n); });
        var actions = $('dialog-actions');
        actions.textContent = '';
        var done = false;
        function onCancel(e) {
          e.preventDefault();
          finish(null);
        }
        function finish(v) {
          if (done) return;
          done = true;
          dialog.removeEventListener('cancel', onCancel);
          dialog.close();
          resolve(v);
        }
        (opts.actions || [{ label: 'OK', kind: 'primary', value: true }]).forEach(function (a) {
          actions.appendChild(el('button', {
            type: 'button', class: 'btn ' + (a.kind || 'muted'), text: a.label,
            onclick: function () { finish(a.value); }
          }));
        });
        dialog.addEventListener('cancel', onCancel);
        dialog.showModal();
      });
    }
    function tell(title, text) {
      return ask({ title: title, body: text ? [text] : [], actions: [{ label: 'OK', kind: 'primary', value: true }] });
    }

    // ---- Data ----------------------------------------------------------
    // The same RPCs and reads as lib/topupsApi.ts.
    function numberish(row, keys) {
      keys.forEach(function (k) { if (row[k] !== null && row[k] !== undefined) row[k] = Number(row[k]); });
      return row;
    }
    async function listTopups(scope) {
      var res = await sb.rpc('admin_list_topups', { p_scope: scope });
      if (res.error) throw res.error;
      return (res.data || []).map(function (r) { return numberish(r, ['amount_sgd', 'pool_balance_sgd']); });
    }
    async function listRedemptions() {
      var res = await sb.rpc('admin_list_redemptions');
      if (res.error) throw res.error;
      var rows = (res.data || []).map(function (r) {
        return numberish(r, ['voucher_value_sgd', 'booster_value_sgd', 'points_redeemed']);
      });
      // Before sql/topup/05 the list has no fulfil_* keys.
      state.redemptionsMissingFulfil = rows.length > 0 && !('fulfilled_at' in rows[0]);
      return rows;
    }
    // Best-effort, like adminFetchDeliveries: a failed read shows "No delivery
    // details given", never blocks the list.
    async function fetchDeliveries(ids) {
      var unique = Array.from(new Set(ids.filter(Boolean)));
      var out = {};
      if (unique.length === 0) return out;
      var res = await sb.from('household_voucher_delivery')
        .select('household_id, recipient_name, recipient_phone, delivery_address')
        .in('household_id', unique);
      if (res.error || !res.data) return out;
      res.data.forEach(function (r) { var d = deliveryFrom(r); if (d) out[r.household_id] = d; });
      return out;
    }
    async function receiptUrl(path) {
      var hit = receiptCache[path];
      if (hit && hit.until > Date.now()) return hit.url;
      var res = await sb.storage.from('topup-receipts').createSignedUrl(path, RECEIPT_URL_SECONDS);
      if (res.error || !res.data) return null;
      receiptCache[path] = { url: res.data.signedUrl, until: Date.now() + (RECEIPT_URL_SECONDS - 60) * 1000 };
      return res.data.signedUrl;
    }
    // Fire-and-forget, as notifyPushEvent in lib/notify.ts: the notify
    // function re-reads the row and sends exactly once.
    function notifyPush(kind, topupId) {
      sb.functions.invoke('notify', { body: { kind: kind, topup_id: topupId } })
        .then(function (r) { if (r.error) console.warn('notify(' + kind + ') failed:', r.error.message); })
        .catch(function (e) { console.warn('notify(' + kind + ') threw:', e); });
    }

    // true / false, or null when the check itself failed (offline). Every
    // caller treats null as "not shown": fails closed, as fetchIsAppAdmin.
    async function isAdmin() {
      try {
        var res = await sb.rpc('is_app_admin');
        if (res.error) return null;
        return res.data === true;
      } catch (e) {
        return null;
      }
    }
    var CHECK_FAILED = 'Could not check that this account is an admin. Check the connection and try again.';

    async function load(opts) {
      opts = opts || {};
      if (!signedIn) return;
      $('refresh').disabled = true;
      try {
        var admin = await isAdmin();
        if (admin === false) {
          await refuse();
          return;
        }
        if (admin === null) throw new Error(CHECK_FAILED);
        var results = await Promise.all([listTopups('open'), listTopups('decided'), listRedemptions()]);
        var deliveries = await fetchDeliveries(results[0].concat(results[1]).map(function (r) { return r.household_id; }));
        state.openRows = results[0];
        state.decidedRows = results[1];
        state.redemptions = results[2];
        state.deliveries = deliveries;
        state.failed = null;
        state.updatedAt = new Date();
      } catch (err) {
        console.warn('load failed:', err);
        state.failed = errorText(err);
      } finally {
        state.loaded = true;
        $('refresh').disabled = false;
      }
      render();
    }

    // Auto-refresh never wipes what Tano is typing or a dialog he is reading.
    function userIsMidAction() {
      if ($('dialog').open || state.busy) return true;
      var a = document.activeElement;
      if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT')) return true;
      return Object.keys(state.rejecting).some(function (id) { return state.rejecting[id].trim().length > 0; });
    }
    function startTimer() {
      stopTimer();
      timer = setInterval(function () {
        if (document.visibilityState === 'visible' && !userIsMidAction()) load();
      }, AUTO_REFRESH_MS);
    }
    function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

    // ---- Actions -------------------------------------------------------
    async function confirmTopup(row) {
      var amount = formatSgd(row.amount_sgd);
      var household = row.household_name || 'Deleted household';
      var go = await ask({
        title: 'Add ' + amount + ' of FairPrice vouchers to ' + household + '’s pool?',
        body: ['Only confirm once ' + amount + ' with reference ' + row.reference +
          ' is in your bank and the FairPrice vouchers are bought. They are added to the household’s reward pool immediately.'],
        actions: [
          { label: 'Not yet', kind: 'muted', value: false },
          { label: 'Add ' + amount + ' of vouchers', kind: 'success', value: true }
        ]
      });
      if (!go) return;
      state.busy = row.id;
      render();
      try {
        var res = await sb.rpc('confirm_topup', { p_topup_id: row.id });
        if (res.error) throw res.error;
        var result = res.data || {};
        notifyPush('topup_confirmed', row.id);
        // The bank statement is the record once matched; the receipt goes.
        if (row.receipt_path) {
          sb.storage.from('topup-receipts').remove([row.receipt_path]).then(function (r) {
            if (r.error) console.warn('receipt delete failed:', r.error.message);
          });
          delete receiptCache[row.receipt_path];
        }
        var balance = result.pool_balance_sgd === null || result.pool_balance_sgd === undefined
          ? row.amount_sgd : Number(result.pool_balance_sgd);
        await tell(result.credited ? 'Confirmed' : 'Already confirmed',
          result.credited
            ? household + '’s reward pool now holds ' + formatSgd(balance) + ' of FairPrice vouchers.'
            : 'This purchase was confirmed earlier. Nothing was added twice.');
      } catch (err) {
        await tell('Could not confirm', errorText(err));
      } finally {
        state.busy = null;
      }
      await load();
    }

    async function rejectTopup(row) {
      var reason = (state.rejecting[row.id] || '').trim();
      if (!reason) return;
      var household = row.household_name || 'Deleted household';
      var go = await ask({
        title: 'Reject ' + formatSgd(row.amount_sgd) + ' from ' + household + '?',
        body: [
          'Reference ' + row.reference + '. The household is told it was not accepted, with your reason:',
          el('p', { class: 'notice', text: reason })
        ],
        actions: [
          { label: 'Back', kind: 'muted', value: false },
          { label: 'Send rejection', kind: 'danger', value: true }
        ]
      });
      if (!go) return;
      state.busy = row.id;
      render();
      try {
        var res = await sb.rpc('reject_topup', { p_topup_id: row.id, p_reason: reason });
        if (res.error) throw res.error;
        notifyPush('topup_rejected', row.id);
        delete state.rejecting[row.id];
      } catch (err) {
        await tell('Could not reject', errorText(err));
      } finally {
        state.busy = null;
      }
      await load();
    }

    async function markSent(row) {
      var note = el('textarea', { id: 'sent-note', maxlength: String(NOTE_MAX), placeholder: 'e.g. 2 × S$5 e-vouchers sent by WhatsApp' });
      var go = await ask({
        title: 'Mark as sent?',
        body: [
          'Only once the FairPrice vouchers for ' + (row.helper_name || 'the helper') + ' (' +
            (row.household_name || 'deleted household') + ') have gone out: ' + redemptionWhat(row) + '.',
          el('label', { class: 'field', for: 'sent-note', text: 'Note (optional — the household can see this)' }),
          note
        ],
        actions: [
          { label: 'Not yet', kind: 'muted', value: false },
          { label: 'Mark as sent', kind: 'primary', value: true }
        ]
      });
      if (!go) return;
      state.busy = row.id;
      render();
      try {
        var res = await sb.rpc('admin_mark_redemption_sent', { p_redemption_id: row.id, p_note: note.value.trim() || null });
        if (res.error) throw res.error;
        var marked = res.data && res.data.marked;
        await tell(marked ? 'Marked as sent' : 'Already marked as sent',
          marked ? 'It moves to Sent.' : 'This one was marked as sent earlier. Nothing changed.');
      } catch (err) {
        await tell('Could not mark as sent', isMissingFunction(err)
          ? 'Marking as sent needs sql/topup/05_admin_mark_redemption_sent.sql to be run first. Until then, mark it in the SQL editor (sql/monitoring_queries.sql).'
          : errorText(err));
      } finally {
        state.busy = null;
      }
      await load();
    }

    // ---- Rendering -----------------------------------------------------
    var TABS = [
      { key: 'open', label: 'To confirm' },
      { key: 'decided', label: 'Decided' },
      { key: 'redemptions', label: 'To send' },
      { key: 'sent', label: 'Sent' }
    ];
    var LEADS = {
      open: 'Match each reference to a PayNow credit in your bank before confirming. Unpaid requests from the last 14 days are listed too, in case someone paid without tapping I’ve paid.',
      decided: 'The last 30 confirmed or rejected voucher purchases.',
      redemptions: 'Helpers’ redeemed rewards waiting for their FairPrice vouchers, with where to send them. Mark one as sent once it has gone out.',
      sent: 'The last 30 redemptions marked as sent.'
    };

    function pendingRedemptions() { return state.redemptions.filter(function (r) { return r.status === 'pending'; }); }
    function sentRedemptions() { return state.redemptions.filter(function (r) { return r.status !== 'pending'; }); }

    function renderTabs() {
      var tabs = $('tabs');
      tabs.textContent = '';
      var counts = {
        open: state.openRows.filter(function (r) { return r.status === 'pending'; }).length,
        redemptions: pendingRedemptions().length
      };
      TABS.forEach(function (t) {
        var selected = state.tab === t.key;
        var btn = el('button', {
          type: 'button', class: 'tab', role: 'tab', 'aria-selected': selected ? 'true' : 'false',
          onclick: function () { state.tab = t.key; render(); }
        }, t.label);
        if (t.key in counts && state.loaded) {
          btn.appendChild(el('span', { class: 'count' + (counts[t.key] ? '' : ' zero'), text: String(counts[t.key]) }));
        }
        tabs.appendChild(btn);
      });
    }

    function emptyState(text) {
      return el('div', { class: 'empty' }, el('div', { class: 'icon', text: '✅' }), el('div', { text: text }));
    }

    function payerLine(row) {
      return el('div', { class: 'muted' },
        el('span', { class: 'pii', text: row.requester_name || 'Unknown payer' }),
        row.requester_email ? ' · ' : '',
        row.requester_email ? el('span', { class: 'pii', text: row.requester_email }) : null);
    }

    function receiptBlock(path) {
      var holder = el('div', { class: 'muted', text: 'Receipt attached (loading…)' });
      receiptUrl(path).then(function (url) {
        if (!url) { holder.textContent = 'Receipt attached (could not load)'; return; }
        var link = el('a', { class: 'receipt', href: url, target: '_blank', rel: 'noopener noreferrer' },
          el('img', { src: url, alt: 'Payment receipt', loading: 'lazy' }),
          el('span', { class: 'link', text: 'Open receipt' }));
        holder.replaceWith(link);
      });
      return holder;
    }

    function openTopupCard(row) {
      var amount = formatSgd(row.amount_sgd);
      var household = row.household_name || 'Deleted household';
      var busy = state.busy === row.id;
      var anyBusy = !!state.busy;
      var card = el('article', { class: 'card' });
      card.appendChild(el('h2', {}, amount + ' FairPrice · ', el('span', { class: 'pii', text: household })));

      var copy = el('button', { type: 'button', class: 'link', text: 'Copy' });
      copy.addEventListener('click', function () {
        navigator.clipboard.writeText(row.reference).then(function () {
          copy.textContent = 'Copied!';
          setTimeout(function () { copy.textContent = 'Copy'; }, 2000);
        });
      });
      card.appendChild(el('div', { class: 'row' }, el('div', { class: 'reference', text: row.reference }), copy));

      card.appendChild(el('div', {
        class: 'status' + (row.status === 'pending' ? ' teal' : ''),
        text: row.status === 'pending'
          ? 'Marked paid ' + timeAgo(row.paid_claimed_at)
          : 'Not marked paid · started ' + timeAgo(row.created_at)
      }));
      card.appendChild(payerLine(row));
      if (row.pool_balance_sgd !== null && row.pool_balance_sgd !== undefined) {
        card.appendChild(el('div', { class: 'muted', text: 'Pool holds ' + formatSgd(row.pool_balance_sgd) + ' of FairPrice vouchers' }));
      }
      // confirm_topup refuses a purchase without it (sql/topup/03).
      card.appendChild(row.acknowledged_at
        ? el('div', { class: 'muted', text: 'FairPrice acknowledged ' + formatDay(row.acknowledged_at) + ' · Terms ' + (row.terms_version || '—') })
        : el('div', { class: 'muted danger-text', text: 'No FairPrice acknowledgment on record — this cannot be confirmed' }));
      card.appendChild(deliveryLine(row.household_id ? state.deliveries[row.household_id] : null));
      if (row.receipt_path) card.appendChild(receiptBlock(row.receipt_path));

      if (row.id in state.rejecting) {
        var area = el('textarea', {
          id: 'reason-' + row.id, maxlength: String(REASON_MAX),
          placeholder: 'e.g. No ' + amount + ' payment with this reference reached us.'
        });
        area.value = state.rejecting[row.id];
        var counter = el('div', { class: 'hint', text: area.value.length + ' / ' + REASON_MAX });
        var send = el('button', { type: 'button', class: 'btn danger', text: busy ? 'Sending…' : 'Send rejection' });
        send.disabled = anyBusy || area.value.trim().length === 0;
        area.addEventListener('input', function () {
          state.rejecting[row.id] = area.value;
          counter.textContent = area.value.length + ' / ' + REASON_MAX;
          send.disabled = !!state.busy || area.value.trim().length === 0;
        });
        send.addEventListener('click', function () { rejectTopup(row); });
        var back = el('button', { type: 'button', class: 'btn muted', text: 'Back' });
        back.disabled = anyBusy;
        back.addEventListener('click', function () { delete state.rejecting[row.id]; render(); });
        card.appendChild(el('label', { class: 'field', for: 'reason-' + row.id, text: 'Why? (the household sees this)' }));
        card.appendChild(area);
        card.appendChild(counter);
        card.appendChild(el('div', { class: 'actions' }, back, send));
      } else {
        var confirmBtn = el('button', { type: 'button', class: 'btn success', text: busy ? 'Confirming…' : 'Confirm' });
        confirmBtn.disabled = anyBusy;
        confirmBtn.addEventListener('click', function () { confirmTopup(row); });
        var rejectBtn = el('button', { type: 'button', class: 'btn danger-outline', text: 'Reject' });
        rejectBtn.disabled = anyBusy;
        rejectBtn.addEventListener('click', function () {
          state.rejecting[row.id] = '';
          render();
          var a = $('reason-' + row.id);
          if (a) a.focus();
        });
        card.appendChild(el('div', { class: 'actions' }, confirmBtn, rejectBtn));
      }
      return card;
    }

    function decidedTopupCard(row) {
      var confirmed = row.status === 'confirmed';
      var card = el('article', { class: 'card subdued' });
      card.appendChild(el('h2', {}, formatSgd(row.amount_sgd) + ' FairPrice · ',
        el('span', { class: 'pii', text: row.household_name || 'Deleted household' })));
      card.appendChild(el('div', { class: 'reference', text: row.reference }));
      card.appendChild(el('div', { class: 'status ' + (confirmed ? 'teal' : 'danger') },
        (confirmed ? 'Confirmed ' : 'Rejected ') + formatDay(row.decided_at),
        row.decided_by_name ? ' by ' : '',
        row.decided_by_name ? el('span', { class: 'pii', text: row.decided_by_name }) : null));
      if (!confirmed && row.reject_reason) card.appendChild(el('div', { class: 'muted', text: row.reject_reason }));
      card.appendChild(payerLine(row));
      card.appendChild(deliveryLine(row.household_id ? state.deliveries[row.household_id] : null));
      return card;
    }

    function redemptionWhat(row) {
      var booster = row.booster_value_sgd || 0;
      return row.voucher_type + ' (' + formatSgd(row.voucher_value_sgd) + ')' +
        (booster > 0 ? ' + ' + formatSgd(booster) + ' of FairPrice vouchers from the reward pool' : '');
    }

    function redemptionCard(row) {
      var pending = row.status === 'pending';
      var card = el('article', { class: 'card' + (pending ? '' : ' subdued') });
      card.appendChild(el('h2', {}, el('span', { class: 'pii', text: row.household_name || 'Deleted household' })));
      var statusText;
      if (pending) statusText = 'Waiting · requested ' + timeAgo(row.created_at);
      else if (row.fulfilled_at) statusText = 'Sent ' + formatDay(row.fulfilled_at) + ' · requested ' + formatDay(row.created_at);
      else statusText = 'Fulfilled · requested ' + formatDay(row.created_at);
      var status = el('div', { class: 'status ' + (pending ? 'coral' : 'teal'), text: statusText });
      if (!pending && row.fulfilled_by_name) {
        status.appendChild(document.createTextNode(' · by '));
        status.appendChild(el('span', { class: 'pii', text: row.fulfilled_by_name }));
      }
      card.appendChild(status);
      card.appendChild(el('div', { class: 'body', text: redemptionWhat(row) }));
      card.appendChild(el('div', { class: 'muted' },
        el('span', { class: 'pii', text: row.helper_name || 'Helper' }),
        ' · ' + Number(row.points_redeemed).toLocaleString('en-SG') + ' pts'));
      card.appendChild(deliveryLine(deliveryFrom(row)));
      if (!pending && row.fulfil_note) card.appendChild(el('div', { class: 'muted', text: 'Note: ' + row.fulfil_note }));
      if (pending) {
        var btn = el('button', { type: 'button', class: 'btn primary', text: state.busy === row.id ? 'Saving…' : 'Mark as sent' });
        btn.disabled = !!state.busy;
        btn.addEventListener('click', function () { markSent(row); });
        card.appendChild(el('div', { class: 'actions' }, btn));
      }
      return card;
    }

    function render() {
      renderTabs();
      $('lead').textContent = LEADS[state.tab];
      $('updated').textContent = state.updatedAt
        ? 'Updated ' + formatTime(state.updatedAt) + ' · refreshes every minute'
        : '';
      var list = $('list');
      list.textContent = '';
      if (!state.loaded) {
        list.appendChild(el('div', { class: 'skeleton' }));
        list.appendChild(el('div', { class: 'skeleton' }));
        return;
      }
      if (state.failed) {
        list.appendChild(el('p', { class: 'notice error', role: 'alert', text: 'Could not load: ' + state.failed + ' Tap Refresh to try again.' }));
        return;
      }
      if (state.tab === 'redemptions' && state.redemptionsMissingFulfil) {
        list.appendChild(el('p', { class: 'notice', text: 'Mark as sent needs sql/topup/05 to be run first.' }));
      }
      var rows, make, empty;
      if (state.tab === 'open') { rows = state.openRows; make = openTopupCard; empty = 'Nothing to confirm.'; }
      else if (state.tab === 'decided') { rows = state.decidedRows; make = decidedTopupCard; empty = 'No decisions yet.'; }
      else if (state.tab === 'redemptions') { rows = pendingRedemptions(); make = redemptionCard; empty = 'No redemptions waiting.'; }
      else { rows = sentRedemptions(); make = redemptionCard; empty = 'Nothing sent yet.'; }
      if (rows.length === 0) list.appendChild(emptyState(empty));
      else rows.forEach(function (r) { list.appendChild(make(r)); });
    }

    // ---- Session -------------------------------------------------------
    function showSignin(message) {
      signedIn = false;
      stopTimer();
      show($('inbox-view'), false);
      show($('refresh'), false);
      show($('signout'), false);
      show($('signin-view'), true);
      var err = $('signin-error');
      err.textContent = message || '';
      show(err, !!message);
    }
    function showInbox() {
      signedIn = true;
      show($('signin-view'), false);
      show($('inbox-view'), true);
      show($('refresh'), true);
      show($('signout'), true);
      $('password').value = '';
      render();
      load();
      startTimer();
    }
    async function refuse(message) {
      signedIn = false; // so the SIGNED_OUT listener does not replace the message
      await sb.auth.signOut();
      resetState();
      showSignin(message || 'This account is not an admin');
    }
    function resetState() {
      state.openRows = []; state.decidedRows = []; state.redemptions = [];
      state.deliveries = {}; state.rejecting = {}; state.busy = null;
      state.loaded = false; state.failed = null; state.updatedAt = null;
      receiptCache = {};
    }

    $('signin-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var email = $('email').value.trim();
      var password = $('password').value;
      if (!email || !password) { showSignin('Enter your email and password.'); return; }
      var button = $('signin-button');
      button.disabled = true;
      button.textContent = 'Signing in…';
      try {
        var res = await sb.auth.signInWithPassword({ email: email, password: password });
        if (res.error) { showSignin(res.error.message || 'Could not sign in.'); return; }
        var admin = await isAdmin();
        if (admin === true) showInbox();
        else await refuse(admin === null ? CHECK_FAILED : undefined);
      } finally {
        button.disabled = false;
        button.textContent = 'Sign in';
      }
    });
    $('signout').addEventListener('click', async function () {
      await sb.auth.signOut();
      resetState();
      showSignin();
    });
    $('refresh').addEventListener('click', function () { load(); });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && signedIn && !userIsMidAction()) load();
    });
    sb.auth.onAuthStateChange(function (event) {
      // Never await inside this callback (the resume-hang lesson): defer.
      if (event === 'SIGNED_OUT' && signedIn) setTimeout(function () { resetState(); showSignin('Signed out. Sign in again to continue.'); }, 0);
    });

    // A session from an earlier visit: re-check admin before showing anything.
    (async function boot() {
      var res = await sb.auth.getSession();
      if (res.data && res.data.session) {
        var admin = await isAdmin();
        if (admin === true) showInbox();
        else if (admin === false) await refuse();
        else showSignin(CHECK_FAILED);
      } else {
        showSignin();
      }
    })();
  })();
  </script>
</body>
</html>
