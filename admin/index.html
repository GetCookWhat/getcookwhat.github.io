  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />

  <!--
    getcookwhat.com/admin/ — Tano's inbox for FairPrice voucher purchases and
    helper voucher redemptions. The web twin of the phone app's admin screen
    (app/admin/topups.tsx, lib/topupsApi.ts): same RPCs, same rules, same
    wording. How to use it: Docs/admin_web.md.

    The Overview tab is the Claude admin dashboard (Docs/admin_dashboard.md),
    live: admin_overview() (sql/ops/01_admin_overview.sql) returns the same
    JSON as scripts/dashboard-snapshot.ts, and the render below is
    scripts/dashboard/dashboard.html's. Counts only.

    SECURITY. This page holds only the PUBLIC project URL and anon key (the
    EXPO_PUBLIC_ values the app already ships). It is not the gate. Every
    read and write below is refused by the database for anyone not in
    app_admins: admin_overview, admin_list_topups, confirm_topup,
    reject_topup, admin_list_redemptions and admin_mark_redemption_sent each
    re-check is_app_admin(), and the notify function re-checks app_admins;
    household_voucher_delivery and the topup-receipts bucket
    are behind is_app_admin() RLS policies. Checking is_app_admin() here only
    decides what to render.

    Everything from the database is written with textContent, never as HTML.
  -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.js"
          integrity="sha384-3wY11tldQ5+yWqAvmTN4XtQvnjoTva0cV15O/O/O5NTtp0ivVopSzLOzsVXWZse9"
          crossorigin="anonymous"></script>
  <style>
    :root {
      --coral: #F0532C;
      --coral-text: #C43D1B;
      --teal: #0A7D6F;
      --danger: #C62828;
      --ink: #2C2C2A;
      --muted: #6B6358;
      --line: #E0DCD0;
      --page: #FBF7F1;
      --card: #FFFFFF;
      --field: #FFFFFF;
      --chip: #F1F0EC;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.12);
      --on-coral: #FFFFFF;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --coral: #F26A47;
        --coral-text: #FF8A66;
        --teal: #3CC9B4;
        --danger: #FF6B66;
        --ink: #F2EFE9;
        --muted: #B5AC9F;
        --line: #3A3733;
        --page: #141311;
        --card: #1F1E1B;
        --field: #262421;
        --chip: #2A2825;
        --shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
        --on-coral: #FFFFFF;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--page);
      color: var(--ink);
      line-height: 1.45;
      font-size: 16px;
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
    .hidden { display: none !important; }

    /* Header */
    header.top {
      position: sticky; top: 0; z-index: 5;
      background: var(--page);
      border-bottom: 1px solid var(--line);
      padding: calc(10px + env(safe-area-inset-top)) 0 10px;
    }
    header.top .wrap { display: flex; align-items: center; gap: 10px; padding-bottom: 0; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; flex: 1; min-width: 0; }
    .brand { white-space: nowrap; }
    .brand img { width: 28px; height: 28px; border-radius: 7px; }
    @media (max-width: 420px) {
      .brand .tag { display: none; }
      .icon-btn { padding: 7px 10px; }
    }
    .brand .tag { font-weight: 600; font-size: 12px; color: var(--coral-text); border: 1.5px solid var(--coral); border-radius: 20px; padding: 1px 8px; }
    .icon-btn {
      font: inherit; font-size: 14px; font-weight: 600;
      background: transparent; color: var(--ink);
      border: 1.5px solid var(--line); border-radius: 10px;
      padding: 7px 12px; cursor: pointer; min-height: 38px;
    }
    .icon-btn:disabled { opacity: 0.5; cursor: default; }
    .updated { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

    h1 { font-size: 26px; margin: 18px 0 4px; }
    .lead { color: var(--muted); margin: 0 0 14px; font-size: 15px; }

    /* Tabs */
    .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 14px 0 12px; }
    @media (max-width: 620px) { .tabs { grid-template-columns: repeat(2, 1fr); } }
    .tab {
      font: inherit; font-size: 14px; font-weight: 600;
      padding: 9px 6px; border-radius: 20px; cursor: pointer;
      background: var(--card); color: var(--ink);
      border: 1.5px solid var(--line);
    }
    .tab[aria-selected="true"] { border-color: var(--coral); color: var(--coral-text); background: var(--card); box-shadow: inset 0 -3px 0 var(--coral); }
    .tab .count { display: inline-block; min-width: 20px; margin-left: 4px; padding: 0 6px; border-radius: 10px; background: var(--coral); color: var(--on-coral); font-size: 12px; line-height: 18px; }
    .tab .count.zero { background: var(--chip); color: var(--muted); }
    .group-label { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }

    /* Cards */
    .card {
      background: var(--card);
      border-left: 3px solid var(--coral);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 14px 16px 16px;
      margin: 0 0 14px;
    }
    .card.subdued { border-left-color: var(--line); }
    .card h2 { font-size: 18px; margin: 0; line-height: 1.3; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .reference { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 18px; font-weight: 700; letter-spacing: 1px; margin-top: 6px; }
    .status { font-weight: 600; margin-top: 8px; }
    .status.teal { color: var(--teal); }
    .status.coral { color: var(--coral-text); }
    .status.danger { color: var(--danger); }
    .muted { color: var(--muted); font-size: 15px; margin-top: 2px; overflow-wrap: anywhere; }
    .muted.italic { font-style: italic; }
    .danger-text { color: var(--danger); }
    .body { margin-top: 6px; }
    .link { font: inherit; font-weight: 700; color: var(--coral-text); background: none; border: 0; padding: 4px 0; cursor: pointer; text-decoration: none; }
    .receipt { display: block; margin-top: 12px; }
    .receipt img { display: block; width: 100%; max-height: 260px; object-fit: contain; border-radius: 12px; background: var(--chip); }

    /* Buttons */
    .actions { display: flex; gap: 8px; margin-top: 14px; }
    .actions > * { flex: 1; }
    .btn {
      font: inherit; font-weight: 700; font-size: 16px;
      min-height: 46px; padding: 10px 14px; border-radius: 12px; cursor: pointer;
      border: 1.5px solid transparent; width: 100%;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn.success { background: #16A34A; color: #FFFFFF; }
    .btn.primary { background: var(--coral); color: var(--on-coral); }
    .btn.danger { background: var(--danger); color: #FFFFFF; }
    .btn.danger-outline { background: transparent; color: var(--danger); border-color: var(--danger); }
    .btn.muted { background: transparent; color: var(--ink); border-color: var(--line); }

    label.field { display: block; font-weight: 600; font-size: 15px; margin: 14px 0 6px; }
    textarea, input[type="email"], input[type="password"] {
      font: inherit; width: 100%; color: var(--ink); background: var(--field);
      border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px;
    }
    textarea { min-height: 84px; resize: vertical; }
    textarea:focus, input:focus { outline: 2px solid var(--coral); outline-offset: 1px; border-color: transparent; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 4px; text-align: right; }

    .empty { text-align: center; padding: 28px 12px; color: var(--muted); }
    .empty .icon { font-size: 28px; }
    .notice { border-radius: 12px; padding: 10px 12px; margin: 0 0 12px; background: var(--chip); font-size: 15px; }
    .notice.error { color: var(--danger); }

    /* Sign-in */
    .signin { max-width: 400px; margin: 40px auto 0; }
    .signin .card { padding: 20px; }
    .signin .btn { margin-top: 18px; }

    /* Dialog */
    dialog {
      border: 0; border-radius: 16px; padding: 20px; width: min(440px, calc(100vw - 32px));
      background: var(--card); color: var(--ink); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
    }
    dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
    dialog h3 { margin: 0 0 8px; font-size: 19px; line-height: 1.3; }
    dialog p { margin: 0 0 8px; color: var(--muted); }
    dialog .actions { flex-direction: column-reverse; }
    @media (min-width: 521px) { dialog .actions { flex-direction: row; } }
    .skeleton { height: 120px; border-radius: 16px; background: var(--chip); margin: 0 0 14px; animation: pulse 1.2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.55; } }

    /* Overview tab: the Claude dashboard's layout (scripts/dashboard/dashboard.html),
       every class prefixed ov- so nothing collides with the inbox cards. */
    @media (max-width: 620px) { .tab.wide { grid-column: 1 / -1; } }
    .ov {
      --ov-bg: var(--page); --ov-card: var(--card); --ov-ink: var(--ink); --ov-ink-2: #5E5A52; --ov-muted: var(--muted);
      --ov-line: var(--line); --ov-accent: var(--coral-text); --ov-stripe: var(--coral);
      --ov-s1: #D9461F; --ov-s2: #0E9483;
      --ov-good: #16794A; --ov-good-bg: #E7F4EC; --ov-warn: #9A4B05; --ov-warn-bg: #FDF1E2;
      --ov-info: #3B5F8A; --ov-info-bg: #E9EFF7; --ov-bad: #B3261E; --ov-bad-bg: #FBE9E7;
      --ov-display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: grid; gap: 14px; font-size: 15px;
    }
    @media (prefers-color-scheme: dark) {
      .ov {
        --ov-ink-2: #C9C5BB; --ov-s1: #EC5A33; --ov-s2: #14A08D;
        --ov-good: #6FD29B; --ov-good-bg: #1D3226; --ov-warn: #F2B45C; --ov-warn-bg: #3A2B16;
        --ov-info: #9CC0EC; --ov-info-bg: #1F2B3A; --ov-bad: #F19A92; --ov-bad-bg: #3D1F1C;
      }
    }
    .ov h2 { font: 650 17px/1.3 var(--ov-display); margin: 0; }
    .ov h3 { font-size: 13px; font-weight: 600; line-height: 1.3; color: var(--ov-ink-2); margin: 0; }
    .ov p { margin: 0; }
    .ov a { color: var(--ov-accent); }
    .ov-num { font-variant-numeric: tabular-nums; }
    .ov-muted { color: var(--ov-muted); }
    .ov-small { font-size: 13px; }
    .ov-stamp { display: flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ov-ink-2); }
    .ov-stamp b { color: var(--ov-ink); font-weight: 600; }
    .ov-chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--ov-line); font-size: 12px; color: var(--ov-ink-2); white-space: nowrap; }
    .ov-card { background: var(--ov-card); border-radius: 16px; box-shadow: var(--shadow); border-left: 3px solid var(--ov-stripe); padding: 14px 14px 16px; display: grid; gap: 12px; min-width: 0; }
    .ov-card.quiet { border-left-color: var(--ov-line); }
    .ov-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
    .ov-attn { display: grid; gap: 8px; }
    .ov-attn-row { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--ov-bg); }
    .ov-attn-row .n { min-width: 44px; text-align: center; font: 700 18px/1 var(--ov-display); padding: 8px 6px; border-radius: 8px; }
    .ov-attn-row.warn .n { background: var(--ov-warn-bg); color: var(--ov-warn); }
    .ov-attn-row.ok .n { background: var(--ov-good-bg); color: var(--ov-good); }
    .ov-attn-row.info .n { background: var(--ov-info-bg); color: var(--ov-info); }
    .ov-attn-row .what { display: grid; gap: 1px; min-width: 0; }
    .ov-attn-row .what b { font-weight: 600; }
    .ov-attn-row .what span { font-size: 13px; color: var(--ov-ink-2); overflow-wrap: anywhere; }
    .ov-state { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .ov-tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    .ov-tile { background: var(--ov-card); border-radius: 12px; box-shadow: var(--shadow); padding: 12px; display: grid; gap: 2px; align-content: start; border: 1px solid transparent; }
    @media (prefers-color-scheme: dark) { .ov-tile { border-color: var(--ov-line); } }
    .ov-tile .label { font-size: 12.5px; color: var(--ov-ink-2); }

    .ov-tile .sub { font-size: 12px; color: var(--ov-muted); }
    .ov-approx { font-family: inherit; font-size: 13px; font-weight: 500; line-height: 1.2; color: var(--ov-ink-2); letter-spacing: 0; white-space: nowrap; }
    .ov-funnel { display: grid; gap: 8px; }
    .ov-f-row { display: grid; grid-template-columns: minmax(118px, 38%) 1fr; gap: 10px; align-items: center; }
    .ov-f-label { font-size: 13.5px; }
    .ov-f-bar { position: relative; height: 26px; background: var(--ov-bg); border-radius: 4px; }
    .ov-f-bar i { position: absolute; inset: 0 auto 0 0; background: var(--ov-s1); border-radius: 0 4px 4px 0; min-width: 2px; }
    .ov-f-bar span { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 13px; font-weight: 600; color: var(--ov-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ov-f-bar span.on { color: #FFFFFF; }
    .ov-charts { display: grid; gap: 16px; }
    .ov-chart { display: grid; gap: 6px; min-width: 0; }
    .ov-chart svg { display: block; width: 100%; overflow: visible; }
    .ov-chart .total { font-size: 13px; color: var(--ov-ink-2); }
    .ov-multi { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
    @media (min-width: 620px) { .ov-multi { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .ov .axis text, .ov .lab { fill: var(--ov-muted); font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
    .ov .grid line { stroke: var(--ov-line); stroke-width: 1; }
    .ov .base { stroke: var(--ov-muted); stroke-width: 1; }
    .ov .bar { fill: var(--ov-s1); }
    .ov .bar.alt { fill: var(--ov-s2); }
    .ov .hit { fill: transparent; cursor: default; }
    .ov .hl { opacity: 0.75; }
    .ov .endlab { fill: var(--ov-ink); font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .ov-tip { position: fixed; pointer-events: none; z-index: 10; background: var(--ink); color: var(--card); padding: 6px 9px; border-radius: 6px; font-size: 12.5px; line-height: 1.35; max-width: 240px; opacity: 0; transition: opacity 0.08s; font-variant-numeric: tabular-nums; }
    .ov-tip.show { opacity: 1; }
    @media (prefers-reduced-motion: reduce) { .ov-tip { transition: none; } }
    .ov-tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .ov table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
    .ov th, .ov td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--ov-line); white-space: nowrap; }
    .ov th:first-child, .ov td:first-child { text-align: left; white-space: normal; min-width: 7em; }
    .ov thead th { font-weight: 600; color: var(--ov-ink-2); font-size: 12px; }
    .ov tbody tr:last-child td { border-bottom: 0; }
    .ov td.zero { color: var(--ov-muted); }
    .ov details { font-size: 13px; }
    .ov details summary { cursor: pointer; color: var(--ov-accent); padding: 2px 0; }
    .ov details[open] summary { margin-bottom: 6px; }
    .ov-kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    @media (min-width: 560px) { .ov-kv { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
    .ov-kv > div { background: var(--ov-bg); border-radius: 8px; padding: 8px 10px; display: grid; gap: 1px; }
    .ov-kv .k { font-size: 12px; color: var(--ov-ink-2); }
    .ov-kv .v { font: 650 17px/1.2 var(--ov-display); font-variant-numeric: tabular-nums; }
    .ov-kv .s { font-size: 11.5px; color: var(--ov-muted); }
    .ov-meter { height: 12px; border-radius: 6px; background: var(--ov-bg); position: relative; overflow: hidden; }
    .ov-meter i { position: absolute; inset: 0 auto 0 0; background: var(--ov-s2); border-radius: 0 6px 6px 0; min-width: 2px; }
    .ov-meter .mark { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ov-warn); }
    .ov-pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; border: 1px solid currentColor; }
    .ov-pill.confirmed { color: var(--ov-good); } .ov-pill.pending { color: var(--ov-warn); } .ov-pill.awaiting_payment { color: var(--ov-info); }
    .ov-pill.rejected { color: var(--ov-bad); } .ov-pill.cancelled { color: var(--ov-muted); }
    .ov-empty { padding: 14px; border-radius: 10px; background: var(--ov-bg); text-align: center; color: var(--ov-ink-2); font-size: 14px; display: grid; gap: 4px; }
    .ov-empty b { font: 650 16px/1.3 var(--ov-display); color: var(--ov-ink); }
    .ov-err { padding: 10px 12px; border-radius: 8px; background: var(--ov-bad-bg); color: var(--ov-bad); font-size: 13px; overflow-wrap: anywhere; }
    .ov-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
    .ov-links a { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ov-line); text-decoration: none; color: var(--ov-ink); font-weight: 550; font-size: 14px; }
    .ov-links a::after { content: "↗"; color: var(--ov-accent); }
    .ov-links a:hover { border-color: var(--ov-accent); }
    .ov-notes { display: grid; gap: 6px; font-size: 12.5px; color: var(--ov-ink-2); }
    .ov-notes p { max-width: 65ch; }
    .ov-foot { font-size: 12px; color: var(--ov-muted); text-align: center; padding-top: 4px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand"><img src="/assets/logo-bowl.png" alt="" /> Cook What? <span class="tag">Admin</span></div>
      <button type="button" class="icon-btn hidden" id="refresh">Refresh</button>
      <button type="button" class="icon-btn hidden" id="signout">Sign out</button>
    </div>
  </header>

  <main class="wrap">
    <!-- Sign-in -->
    <section id="signin-view" class="signin hidden" aria-labelledby="signin-title">
      <div class="card">
        <h2 id="signin-title">Sign in</h2>
        <p class="muted">Admins only. Use the Cook What? account that is on the admin list.</p>
        <form id="signin-form" novalidate>
          <label class="field" for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required />
          <label class="field" for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
          <p id="signin-error" class="notice error hidden" role="alert"></p>
          <button type="submit" class="btn primary" id="signin-button">Sign in</button>
        </form>
      </div>
    </section>

    <!-- Inbox -->
    <section id="inbox-view" class="hidden">
      <h1 id="page-title">Overview</h1>
      <p class="updated" id="updated" aria-live="polite"></p>
      <div class="tabs" role="tablist" id="tabs"></div>
      <p class="lead" id="lead"></p>
      <div id="list"></div>
    </section>
  </main>

  <dialog id="dialog" aria-labelledby="dialog-title">
    <h3 id="dialog-title"></h3>
    <div id="dialog-body"></div>
    <div class="actions" id="dialog-actions"></div>
  </dialog>

  <script>
  (function () {
    'use strict';

    // Never run inside someone else's frame (a meta CSP cannot set
    // frame-ancestors, and GitHub Pages cannot send the header).
    if (window.top !== window.self) {
      document.body.textContent = '';
      return;
    }

      for (var i = 2; i < arguments.length; i++) {

      if (!iso) return '';
      var diff = Date.now() - new Date(iso).getTime();
      if (!isFinite(diff)) return '';
      var minutes = Math.floor(diff / 60000);
      if (minutes < 1) return 'just now';
      if (minutes < 60) return minutes + ' min ago';
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + ' h ago';
      var days = Math.floor(hours / 24);
      return days === 1 ? '1 day ago' : days + ' days ago';
    }

        actions.textContent = '';
        var done = false;
        function onCancel(e) {
          e.preventDefault();
          finish(null);
        }
        function finish(v) {
          if (done) return;
          done = true;
          dialog.removeEventListener('cancel', onCancel);
          dialog.close();
          resolve(v);
        }
        (opts.actions || [{ label: 'OK', kind: 'primary', value: true }]).forEach(function (a) {
          actions.appendChild(el('button', {
            type: 'button', class: 'btn ' + (a.kind || 'muted'), text: a.label,
            onclick: function () { finish(a.value); }
          }));
        });
        dialog.addEventListener('cancel', onCancel);
        dialog.showModal();

              oe('span', { class: 'total ov-num' }, usdS(AI.current_period_spend_incl_test_usd) + ' of ' + usdS(AI.anthropic_limit_usd))),
            oe('div', { class: 'ov-meter', role: 'meter', 'aria-valuemin': 0, 'aria-valuemax': AI.anthropic_limit_usd, 'aria-valuenow': AI.current_period_spend_incl_test_usd, 'aria-label': 'AI spend against the Anthropic limit' },
              oe('i', { style: 'width:' + (share * 100).toFixed(2) + '%' }), oe('span', { class: 'mark', style: 'left:80%', title: '80%' })),
            oe('p', { class: 'ov-muted ov-small' }, 'Includes test households, because Anthropic bills them too. The amber tick is 80%. Limit source: ' + AI.anthropic_limit_source + '.')),
          oe('div', { class: 'ov-kv' },
            kv('Real households', usd(AI.current_period_spend_usd), approx(AI.current_period_spend_usd) + ' · this period'),
            kv('Spending now', fmt(AI.households_spending_now), 'households'),
            kv('At 80%+ of cap', fmt(AI.households_near_cap.length), 'households'),
            kv('Cap', usd(AI.cap_usd_per_household), approx(AI.cap_usd_per_household) + ' · per household')),
          AI.households_near_cap.length
            ? ovTable(['Household', 'Spent', 'Of cap'], AI.households_near_cap.map(function (h) { return [h.household, usdS(h.spent_usd), Math.round(h.share_of_cap * 100) + '%']; }))
            : null,
          oe('p', { class: 'ov-muted ov-small' }, AI.definition + ' S$ figures are approximate, at a fixed US$1 = S$' + Number(FX).toFixed(2) + ' (admin_settings); Anthropic bills in US$.')));
      } else add(ovCard('AI spend', null, sectionError('ai')));

      // Top-ups
      if (isOk(TU)) {
        var st = TU.by_status, red = TU.redemptions, hp = TU.helper_points;
        add(ovCard('Voucher top-ups', oe('span', { class: 'ov-muted ov-small' }, 'FairPrice vouchers, PayNow'),
          oe('div', { class: 'ov-kv' },
            kv('Confirmed this week', sgd(TU.confirmed_sgd.this_week), null),
            kv('This month', sgd(TU.confirmed_sgd.this_month), null),
            kv('All time', sgd(TU.confirmed_sgd.all_time), fmt(st.confirmed.n) + ' top-ups'),
            kv('Pending', fmt(TU.pending.n), TU.pending.n ? 'oldest ' + TU.pending.oldest_age_days + ' days' : 'none waiting')),
          ovTable(['Status', 'Requests', 'S$'], [
            ['Awaiting payment', st.awaiting_payment.n, sgd(st.awaiting_payment.sgd)],
            ['Pending (paid, to confirm)', st.pending.n, sgd(st.pending.sgd)],
            ['Confirmed', st.confirmed.n, sgd(st.confirmed.sgd)],
            ['Rejected', st.rejected.n, sgd(st.rejected.sgd)],
            ['Cancelled', st.cancelled.n, sgd(st.cancelled.sgd)]
          ]),
          TU.awaiting_payment_expired ? oe('p', { class: 'ov-muted ov-small' }, fmt(TU.awaiting_payment_expired) + ' awaiting payment are past their 7-day expiry.') : null,
          oe('h3', {}, 'Last 20 top-ups'),
          TU.recent.length
            ? ovTable(['Date', 'Reference', 'Amount', 'Status'], TU.recent.map(function (r) {
                return [dmy(r.date), r.reference, sgd(r.amount_sgd), oe('span', { class: 'ov-pill ' + r.status }, r.status.replace('_', ' '))];
              }))
            : oe('p', { class: 'ov-muted ov-small' }, 'No top-ups from real households yet' + (TU.excluded_test.total ? ' (' + TU.excluded_test.total + ' from test households left out)' : '') + '.'),
          oe('h3', {}, 'Helper voucher redemptions'),
          oe('div', { class: 'ov-kv' },
            kv('Pending', fmt(red.pending.n), red.pending.n ? sgd(red.pending.voucher_sgd) + ', oldest ' + red.pending.oldest_age_days + ' days' : 'none waiting'),
            kv('Fulfilled', fmt(red.fulfilled.n), sgd(red.fulfilled.voucher_sgd))),
          oe('div', { class: 'ov-kv' },
            kv('Helper points waiting to be redeemed', fmt(hp.points) + ' pts', sgd(hp.sgd) + ' at S$' + hp.voucher_sgd + ' = ' + fmt(hp.voucher_points) + ' pts'),
            kv('Helpers holding points', fmt(hp.helpers_with_points), fmt(hp.helpers_at_voucher) + ' with enough for a voucher'))));
      } else add(ovCard('Voucher top-ups', null, sectionError('topups')));

      // Referrals
      if (REF && REF.status === 'ok') {
        var rrows = REF.report || [];
        var cols = rrows.length ? Object.keys(rrows[0]) : [];
        add(ovCard('Referrals', oe('span', { class: 'ov-muted ov-small' }, fmt(REF.partners) + ' partners'),
          rrows.length
            ? ovTable(cols.map(function (c) { return c.replace(/_/g, ' '); }), rrows.map(function (r) { return cols.map(function (c) { return typeof r[c] === 'number' ? fmt(r[c]) : (r[c] == null ? '–' : r[c]); }); }))
            : oe('p', { class: 'ov-muted ov-small' }, REF.report_view ? 'No partner rows yet.' : 'The partner table exists, but no report view yet.'),
          REF.holding_helpers != null ? oe('div', { class: 'ov-kv' }, kv('Holding helpers', fmt(REF.holding_helpers), 'waiting for a household')) : null));
      } else if (REF && REF.status === 'error') add(ovCard('Referrals', null, sectionError('referrals')));
      else {
        var rc = ovCard('Referrals', null, oe('div', { class: 'ov-empty' }, oe('b', {}, 'Not started yet'),
          oe('span', {}, 'Per-partner households, trials, paying, net S$ and commission show here once the partner code ships (v1.1).')));
        rc.classList.add('quiet');
        add(rc);
      }

      // Consoles
      var L = [
        ['App Store Connect', 'https://appstoreconnect.apple.com/apps'],
        ['Play Console', 'https://play.google.com/console/developers'],
        ['RevenueCat', 'https://app.revenuecat.com/'],
        ['Cloudflare Web Analytics', 'https://dash.cloudflare.com/?to=/:account/web-analytics'],
        ['Search Console', 'https://search.google.com/search-console?resource_id=sc-domain:getcookwhat.com']
      ];
      add(ovCard('Consoles', null, oe('div', { class: 'ov-links' }, L.map(function (l) { return oe('a', { href: l[1], target: '_blank', rel: 'noopener noreferrer' }, l[0]); }))));

      var ex = SNAP.exclusions;
      add(oe('p', { class: 'ov-foot' },
        ex ? 'Every count leaves out ' + ex.accounts + ' test accounts in ' + ex.households + ' households (team logins, the App Review demo, Play closed-test testers, example.com sign-ups). ' : '',
        'Counts only; no names or emails. The test-account list and the rates are in the database (admin_excluded_emails, admin_settings; Docs/admin_dashboard.md).'));
      return root;
    }

    function render() {
      renderTabs();
      var onOverview = state.tab === 'overview';
      $('page-title').textContent = onOverview ? 'Overview' : 'Voucher purchases';
      $('lead').textContent = LEADS[state.tab];
      var at = onOverview ? state.overviewAt : state.updatedAt;
      $('updated').textContent = at
        ? 'Updated ' + formatTime(at) + ' · refreshes every minute'
        : '';
      var list = $('list');
      // Keep any "Show as table" the reader opened across the minute refresh.
      var openDetails = {};
      Array.prototype.forEach.call(list.querySelectorAll('details[open][data-k]'), function (d) { openDetails[d.getAttribute('data-k')] = true; });
      list.textContent = '';
      ovCharts = [];
      if (!state.loaded) {
        list.appendChild(el('div', { class: 'skeleton' }));
        list.appendChild(el('div', { class: 'skeleton' }));
        return;
      }
      if (onOverview) {
        if (state.overviewMissing) {
          list.appendChild(el('p', { class: 'notice', text: 'The Overview needs sql/ops/01_admin_overview.sql to be run first. The other four tabs work as before.' }));
        } else if (state.overviewFailed && !state.overview) {
          list.appendChild(el('p', { class: 'notice error', role: 'alert', text: 'Could not load the overview: ' + state.overviewFailed + ' Tap Refresh to try again.' }));
        } else if (state.overview) {
          if (state.overviewFailed) list.appendChild(el('p', { class: 'notice error', role: 'alert', text: 'Could not refresh: ' + state.overviewFailed + ' Showing the numbers from ' + formatTime(state.overviewAt) + '.' }));
          list.appendChild(renderOverview(state.overview));
          // Draw now that the boxes have a width (requestAnimationFrame alone
          // can wait while the tab is in the background).
          ovCharts.forEach(function (f) { f(); });
          Array.prototype.forEach.call(list.querySelectorAll('details[data-k]'), function (d) { if (openDetails[d.getAttribute('data-k')]) d.open = true; });
        }
        return;
      }
      if (state.failed) {
        list.appendChild(el('p', { class: 'notice error', role: 'alert', text: 'Could not load: ' + state.failed + ' Tap Refresh to try again.' }));
        return;
      }
      if (state.tab === 'redemptions' && state.redemptionsMissingFulfil) {
        list.appendChild(el('p', { class: 'notice', text: 'Mark as sent needs sql/topup/05 to be run first.' }));
      }
      var rows, make, empty;
      if (state.tab === 'open') { rows = state.openRows; make = openTopupCard; empty = 'Nothing to confirm.'; }
      else if (state.tab === 'decided') { rows = state.decidedRows; make = decidedTopupCard; empty = 'No decisions yet.'; }
      else if (state.tab === 'redemptions') { rows = pendingRedemptions(); make = redemptionCard; empty = 'No redemptions waiting.'; }
      else { rows = sentRedemptions(); make = redemptionCard; empty = 'Nothing sent yet.'; }
      if (rows.length === 0) list.appendChild(emptyState(empty));
      else rows.forEach(function (r) { list.appendChild(make(r)); });
    }

    // ---- Session -------------------------------------------------------
    function showSignin(message) {
      signedIn = false;
      stopTimer();
      show($('inbox-view'), false);
      show($('refresh'), false);
      show($('signout'), false);
      show($('signin-view'), true);
      var err = $('signin-error');
      err.textContent = message || '';
      show(err, !!message);
    }
    function showInbox() {
      signedIn = true;
      show($('signin-view'), false);
      show($('inbox-view'), true);
      show($('refresh'), true);
      show($('signout'), true);
      $('password').value = '';
      render();
      load();
      startTimer();
    }
    async function refuse(message) {
      signedIn = false; // so the SIGNED_OUT listener does not replace the message
      await sb.auth.signOut();
      resetState();
      showSignin(message || 'This account is not an admin');
    }
    function resetState() {
      state.openRows = []; state.decidedRows = []; state.redemptions = [];
      state.deliveries = {}; state.rejecting = {}; state.busy = null;
      state.loaded = false; state.failed = null; state.updatedAt = null;
      state.overview = null; state.overviewAt = null; state.overviewMissing = false; state.overviewFailed = null;
      receiptCache = {};
    }

    $('signin-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      var email = $('email').value.trim();
      var password = $('password').value;
      if (!email || !password) { showSignin('Enter your email and password.'); return; }
      var button = $('signin-button');
      button.disabled = true;
      button.textContent = 'Signing in…';
      try {
        var res = await sb.auth.signInWithPassword({ email: email, password: password });
        if (res.error) { showSignin(res.error.message || 'Could not sign in.'); return; }
        var admin = await isAdmin();
        if (admin === true) showInbox();
        else await refuse(admin === null ? CHECK_FAILED : undefined);
      } finally {
        button.disabled = false;
        button.textContent = 'Sign in';
      }
    });
    $('signout').addEventListener('click', async function () {
      await sb.auth.signOut();
      resetState();
      showSignin();
    });
    $('refresh').addEventListener('click', function () { load(); });
    var resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () { ovCharts.forEach(function (f) { f(); }); }, 120);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && signedIn && !userIsMidAction()) load();
    });
    sb.auth.onAuthStateChange(function (event) {
      // Never await inside this callback (the resume-hang lesson): defer.
      if (event === 'SIGNED_OUT' && signedIn) setTimeout(function () { resetState(); showSignin('Signed out. Sign in again to continue.'); }, 0);
    });

    // A session from an earlier visit: re-check admin before showing anything.
    (async function boot() {
      var res = await sb.auth.getSession();
      if (res.data && res.data.session) {
        var admin = await isAdmin();
        if (admin === true) showInbox();
        else if (admin === false) await refuse();
        else showSignin(CHECK_FAILED);
      } else {
        showSignin();
      }
    })();
  })();
  </script>
</body>
</html>
